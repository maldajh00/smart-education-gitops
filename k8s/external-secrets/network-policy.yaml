# Network isolation for External Secrets Operator.
#
# - Default deny for all ingress/egress in the external-secrets namespace.
# - ESO controller can reach DNS, Vault, and the Kubernetes API.
# - ESO cert-controller can reach DNS and the Kubernetes API.
# - ESO webhook accepts admission traffic on its actual container port 10250.
#
# IMPORTANT: two independent mechanisms make the egress rules below need
# addresses other than the Service ClusterIPs a client naively dials
# (confirmed via live connectivity testing):
#
#   - The "kubernetes" Service (34.118.224.1) has no pod backend; its
#     Endpoints object resolves to the real private control-plane address
#     (currently 10.10.0.2). kube-proxy DNATs traffic to that real address
#     before Calico evaluates the policy, so a rule written against the
#     34.118.224.1 ClusterIP itself never matches and silently drops it.
#   - Cluster DNS is served by the NodeLocal DNSCache addon, which BINDS
#     both 169.254.20.10 and the literal kube-dns ClusterIP
#     (34.118.224.10) directly on its own node-local interface (see its
#     Corefile: `bind 169.254.20.10 34.118.224.10`). There is no DNAT
#     here — the packet's destination never changes from whichever
#     address the pod actually dialed — so both addresses need their own
#     ipBlock rule; neither is a normal pod IP a namespaceSelector can
#     match.
#
# The Vault rule below is unaffected: it already targets Vault's real pod
# labels/namespace rather than its Service ClusterIP, which is exactly
# what kube-proxy's normal (non-NodeLocalDNS-style) Service DNAT requires.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-controller-egress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Egress
  egress:

    # DNS: kube-system pods (direct pod-to-pod resolution path)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # DNS: NodeLocal DNSCache. Bound directly on both addresses (see
    # comment above) — pods dial 34.118.224.10 (their resolv.conf
    # nameserver) with no NAT involved, so that literal address needs its
    # own rule; 169.254.20.10 is kept for any client configured to dial
    # the node-local address directly.
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 34.118.224.10/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # HashiCorp Vault (targets real Vault pod labels, not a Service ClusterIP)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP

    # Kubernetes API server. The "kubernetes" Service has no pod backend,
    # so the real (post-DNAT) destination is its Endpoints address, not
    # the 34.118.224.1 ClusterIP.
    - to:
        - ipBlock:
            cidr: 10.10.0.2/32
      ports:
        - port: 443
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-cert-controller-egress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
  policyTypes:
    - Egress
  egress:

    # DNS: kube-system pods (direct pod-to-pod resolution path)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # DNS: NodeLocal DNSCache (see comment above)
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 34.118.224.10/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Kubernetes API server (see comment above)
    - to:
        - ipBlock:
            cidr: 10.10.0.2/32
      ports:
        - port: 443
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-webhook-ingress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes:
    - Ingress
  ingress:

    # Kubernetes API server admission traffic.
    # ESO webhook listens on container port 10250.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 10250
          protocol: TCP
