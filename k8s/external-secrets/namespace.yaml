# Dedicated namespace for External Secrets Operator.
#
# PSA baseline for compatibility with the upstream Helm chart (webhook +
# cert-controller). Restricted may reject the chart's default securityContext.
# Kept isolated from `smart-education` (still restricted) and `vault`.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    name: external-secrets
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: smart-education-platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
