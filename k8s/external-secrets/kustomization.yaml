# Kustomize bundle for ESO-adjacent, non-Helm resources.
# The ESO controller itself is installed via the smart-education-eso
# ArgoCD Application (Helm source pinned to chart 0.10.5). This bundle
# holds the namespace and NetworkPolicies so they live in git alongside
# the Helm-driven install.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - network-policy.yaml

# NOTE: `labels` (not the legacy `commonLabels`) with includeSelectors: false.
# commonLabels injects into every matchLabels/selector field it can find,
# including NetworkPolicy podSelector. The ESO controller/cert-controller/
# webhook Deployments are Helm-managed and only carry Helm's own labels
# (app.kubernetes.io/managed-by=Helm, no part-of), so a podSelector padded
# with app.kubernetes.io/managed-by=argocd + part-of=smart-education-platform
# never matches those pods, leaving them fully blocked by default-deny-all.
labels:
  - pairs:
      app.kubernetes.io/part-of: smart-education-platform
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
