apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-education-vault-integration
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: smart-education-infra

  source:
    repoURL: https://github.com/maldajh00/smart-education-gitops.git
    targetRevision: main
    path: k8s/vault-integration
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: smart-education

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
