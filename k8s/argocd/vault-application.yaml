# ArgoCD Application: smart-education-vault
#
# Multi-source: syncs the Vault infrastructure bundle from k8s/vault/
# (StatefulSet, Service, PDB, RBAC — commonLabels kept there because
# those selectors are immutable and already live with the labels it
# produces) plus the vault namespace's NetworkPolicies from the
# independent k8s/vault-network-policy/ kustomize root (see that
# directory's network-policy.yaml for why it's built separately).
# Does NOT create any Vault credentials; those come from the manual
# bootstrap script.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-education-vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: smart-education-infra

  sources:
    - repoURL: https://github.com/maldajh00/smart-education-gitops.git
      targetRevision: main
      path: k8s/vault
    - repoURL: https://github.com/maldajh00/smart-education-gitops.git
      targetRevision: main
      path: k8s/vault-network-policy

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - CreateNamespace=false      # namespace.yaml is in the bundle
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
