# ArgoCD Application: smart-education-vault
#
# Syncs the Vault infrastructure bundle from k8s/vault/. Does NOT create
# any Vault credentials; those come from the manual bootstrap script.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-education-vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: smart-education-infra

  source:
    repoURL: https://github.com/maldajh00/smart-education-gitops.git
    targetRevision: main
    path: k8s/vault

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - CreateNamespace=false      # namespace.yaml is in the bundle
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
