# ArgoCD Application: smart-education-prod
#
# Desired state:
#   maldajh00/smart-education-gitops @ main
#   path: k8s/overlays/prod
#
# ArgoCD manages the production Smart Education application.
# The backend HPA owns Deployment.spec.replicas, so ArgoCD
# ignores only that field for the backend Deployment.

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: smart-education-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: smart-education

  source:
    repoURL: https://github.com/maldajh00/smart-education-gitops.git
    targetRevision: main
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: smart-education

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      namespace: smart-education
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
