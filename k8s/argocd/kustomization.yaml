# NOT sync'd by ArgoCD itself — this is bootstrap material for the argocd
# namespace that must exist before the smart-education Application can be
# created. Apply once, out-of-band, during the ArgoCD install phase.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - app-project.yaml
  - application.yaml
  # Infra AppProject + Applications for Vault and External Secrets
  # Operator. These are bootstrap material for the argocd namespace and
  # are applied once, out-of-band, alongside app-project.yaml/application.yaml.
  - infra-app-project.yaml
  - vault-application.yaml
  - external-secrets-application.yaml
  - vault-integration-application.yaml
