# ArgoCD Application: smart-education-eso
#
# Installs External Secrets Operator via the upstream Helm chart at a
# pinned version. Also syncs k8s/external-secrets/ (namespace + NPs).
#
# Two sources are combined: multi-source is required so the Helm chart
# (from charts.external-secrets.io) and our namespace/NP manifests
# (from this GitOps repo) can be reconciled by the same Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-education-eso
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: smart-education-infra

  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.10.5      # pinned; never `*`
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/k8s/external-secrets/values-eso.yaml
    - repoURL: https://github.com/maldajh00/smart-education-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/maldajh00/smart-education-gitops.git
      targetRevision: main
      path: k8s/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - CreateNamespace=false      # namespace.yaml is in the second source
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
