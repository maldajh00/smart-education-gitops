# GitOps OVERLAY: prod
#
# Production overlay.
#
# Responsibilities:
#   - Pin application images to immutable Git SHAs promoted by CI.
#   - Configure production-only public ingress and TLS.
#   - Keep production configuration separate from the reusable base.
#
# CI updates the two image newTag values below after successfully building
# and publishing an application commit. ArgoCD then reconciles this overlay.
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smart-education

resources:
  - ../../base
  - ingress

images:
  - name: me-central1-docker.pkg.dev/smart-education-assignment/prod-gke-repo/smart-education-backend
    newTag: e6d5f4bc391551579d61ee28c3e86524f7d37c55
  - name: me-central1-docker.pkg.dev/smart-education-assignment/prod-gke-repo/smart-education-frontend
    newTag: e6d5f4bc391551579d61ee28c3e86524f7d37c55

patches:
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://smart-education.aldajh-software.com"

commonLabels:
  environment: prod
  app.kubernetes.io/managed-by: argocd
