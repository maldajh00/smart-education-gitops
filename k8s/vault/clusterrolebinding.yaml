# Minimal ClusterRoleBinding: grants ONLY `system:auth-delegator` to the
# vault-auth-delegator SA. This is the single cluster-scoped permission
# Vault needs to validate SA tokens via the Kubernetes TokenReview API
# during auth/kubernetes login. It is NOT cluster-admin and does not
# grant read/write on any resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth-delegator
    namespace: vault
