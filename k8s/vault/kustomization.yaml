# Kustomize bundle for the Vault infrastructure. Applied by the
# smart-education-infra ArgoCD Application, NOT by smart-education-prod
# (the destination namespace differs).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - pdb.yaml

# NetworkPolicies for this namespace are NOT built here — see
# k8s/vault-network-policy/network-policy.yaml for why, and
# k8s/argocd/vault-application.yaml for the second ArgoCD source that
# builds them independently.
commonLabels:
  app.kubernetes.io/part-of: smart-education-platform
  app.kubernetes.io/managed-by: argocd
