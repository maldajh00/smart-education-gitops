# Two ServiceAccounts:
#
# - vault: the identity the Vault server pod runs as. Vault itself uses
#   this SA's projected token when calling TokenReview against the
#   Kubernetes API to validate client tokens on auth/kubernetes login.
#
# - vault-auth-delegator: minimal separate SA that is granted
#   `system:auth-delegator` so Vault can do TokenReview. Kept distinct
#   from `vault` so the Vault server pod itself is not the holder of
#   cluster-scoped privileges (defense in depth).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth-delegator
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: auth-delegator
automountServiceAccountToken: true
