# GitOps BASE — self-contained.
#
# Every reusable application manifest for the smart-education namespace is
# listed below. Environment-specific configuration belongs in overlays.
#
# NOTE — no Secret is included here on purpose. `backend-secret` is
# provisioned by Vault + External Secrets Operator and is consumed by the
# backend and PostgreSQL workloads.
#
# NOTE — public ingress and TLS are intentionally NOT part of the base.
# Production ingress is defined under:
#   overlays/prod/ingress/
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - backend-serviceaccount.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-hpa.yaml
  - frontend-pdb.yaml
  - migration-job.yaml
  - network-policy.yaml
  - postgres
  # Vault-integration lives inside the smart-education namespace.
  # The ExternalSecret materializes `backend-secret` from Vault.
  - external-secret
