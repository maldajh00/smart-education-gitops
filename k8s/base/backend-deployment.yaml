apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: smart-education-portal
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # After migration Job (wave 5) and Postgres (wave -1).
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-education-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-education-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: smart-education-portal
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: app-service-account
      automountServiceAccountToken: false
      # Pin application workloads to the application node pool. The
      # management node carries taint workload=management:NoSchedule so
      # this selector alone (no toleration) keeps us off it.
      nodeSelector:
        workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: me-central1-docker.pkg.dev/smart-education-assignment/prod-gke-repo/smart-education-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Liveness: process is up? Uses /health which never touches the DB,
          # so a Postgres blip does not restart pods.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: gates traffic; /ready checks DB connectivity.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup: gives slow starts up to 30s (3s x 10) without failing liveness.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
