apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-backend
    app.kubernetes.io/part-of: smart-education-portal
  # ---- Workload Identity ----
  # Uncomment and set to bind this KSA to a Google Service Account (GSA):
  #   annotations:
  #     iam.gke.io/gcp-service-account: smart-education-app@smart-education-assignment.iam.gserviceaccount.com
  #
  # Requires Workload Identity enabled on the GKE cluster + node pool, and:
  #   gcloud iam service-accounts add-iam-policy-binding \
  #     smart-education-app@smart-education-assignment.iam.gserviceaccount.com \
  #     --role roles/iam.workloadIdentityUser \
  #     --member "serviceAccount:smart-education-assignment.svc.id.goog[smart-education/app-service-account]"
automountServiceAccountToken: false
