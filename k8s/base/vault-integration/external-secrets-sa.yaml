# ServiceAccount used by ESO to authenticate to Vault via auth/kubernetes.
#
# This SA lives in the smart-education namespace (NOT in external-secrets)
# because the Vault role `smart-education-db-reader` binds specifically to
# ServiceAccounts in this namespace — matching the audit boundary of the
# application.
#
# The SA has no RBAC and no cluster permissions. Its only purpose is to
# have a projected JWT that ESO exchanges for a Vault token via the
# kubernetes auth mount. The `audience: vault` on the projected token is
# what the Vault role validates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: smart-education
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: vault-auth
    app.kubernetes.io/part-of: smart-education-portal
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
automountServiceAccountToken: false
