# ExternalSecret that materializes `backend-secret` in smart-education.
#
# CRITICAL: the target Secret name and keys must match exactly what the
# existing backend Deployment (envFrom.secretRef) and Postgres StatefulSet
# (secretKeyRef.key: DATABASE_USER / DATABASE_PASSWORD) consume. No app
# or manifest changes are required — this ExternalSecret is a drop-in
# replacement for a hand-created Kubernetes Secret.
#
# - refreshInterval: 1h. ESO re-reads Vault every hour and updates the
#   Secret on change. Backend pods don't auto-reload envFrom values — a
#   rollout is required to pick up a rotation (documented in the phase
#   report §K).
# - creationPolicy: Owner (default) — ESO creates and owns the Secret;
#   deleting the ExternalSecret deletes the Secret.
# - deletionPolicy: Retain — if the ExternalSecret is removed the
#   Secret is NOT deleted (avoids taking down a running Postgres pod
#   whose password only exists in `pg_authid`).
# - Sync wave -5: after ClusterSecretStore is up.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-backend
    app.kubernetes.io/component: external-secret
    app.kubernetes.io/part-of: smart-education-portal
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backend-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: smart-education-backend
          app.kubernetes.io/part-of: smart-education-portal
          managed-by: external-secrets
  data:
    - secretKey: DATABASE_USER
      remoteRef:
        key: smart-education/database
        property: DATABASE_USER
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: smart-education/database
        property: DATABASE_PASSWORD
