apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: smart-education-portal
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # After backend (wave 10).
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-education-frontend
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-education-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: smart-education-portal
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # "nginx" uid in the nginx:alpine image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: me-central1-docker.pkg.dev/smart-education-assignment/prod-gke-repo/smart-education-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
