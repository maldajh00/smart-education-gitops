# NetworkPolicies for the Smart Education production workload.
#
# IMPORTANT:
# These policies require GKE NetworkPolicy enforcement to be enabled
# at the cluster level before they become effective.
#
# Traffic model:
#   Internet / GKE LB -> Frontend
#   Frontend          -> Backend:8000
#   GCE health checks -> Backend:8000
#   GMP collectors    -> Backend:8000
#   Backend           -> PostgreSQL:5432
#   Frontend/Backend/PostgreSQL -> Kubernetes DNS
#   Backend           -> GKE metadata server:987/988
#
# Apply through GitOps/ArgoCD. Do not manually maintain live objects.
# After changing these policies, validate with positive and negative
# connectivity tests before declaring NetworkPolicy enforcement complete.
---

# Default-deny for all pods in the smart-education namespace.
#
# Once GKE NetworkPolicy enforcement is enabled, pods will have no
# ingress or egress unless another NetworkPolicy explicitly allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: smart-education
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---

# Frontend pods:
# - Accept HTTP ingress.
# - Egress only to backend:8000 and Kubernetes DNS.
#
# The ingress is intentionally open because the GKE load balancer /
# ingress health-check path does not originate from a predictable
# namespace/pod selector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: smart-education
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-education-frontend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - {}

  egress:
    # Frontend -> Backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-backend
      ports:
        - port: 8000
          protocol: TCP

    # Frontend -> Kubernetes DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---

# Backend pods:
# - Accept traffic from frontend pods.
# - Accept GKE load-balancer health checks.
# - Accept Managed Service for Prometheus scrapes.
# - Egress only to PostgreSQL, Kubernetes DNS, and the GKE
#   metadata server used by Workload Identity Federation for GKE.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: smart-education
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-education-backend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Frontend -> Backend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-frontend
      ports:
        - port: 8000
          protocol: TCP

    # GKE Ingress / Google Cloud Load Balancer health checks.
    #
    # These Google Front End ranges must remain allowed so the
    # load balancer can continue to mark the backend healthy.
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - port: 8000
          protocol: TCP

    # Google Managed Service for Prometheus / GMP.
    #
    # Allows collectors in gmp-system to scrape /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 8000
          protocol: TCP

  egress:
    # Backend -> PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-postgres
      ports:
        - port: 5432
          protocol: TCP

    # Backend -> Kubernetes DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Backend -> GKE metadata server.
    #
    # The application node pool uses GKE_METADATA and the cluster
    # uses Workload Identity Federation for GKE.
    #
    # Both documented metadata-server ports are explicitly allowed.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - port: 988
          protocol: TCP
        - port: 987
          protocol: TCP

    # If PostgreSQL is later migrated to Cloud SQL over Private IP,
    # replace/add the appropriate VPC CIDR egress rule here.

---

# PostgreSQL pods:
# - Accept PostgreSQL traffic only from backend pods.
# - Egress only to Kubernetes DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: smart-education
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-education-postgres

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Backend -> PostgreSQL
    #
    # This also covers the backend migration Job because it uses
    # the same backend application label.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-backend
      ports:
        - port: 5432
          protocol: TCP

  egress:
    # PostgreSQL -> Kubernetes DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
