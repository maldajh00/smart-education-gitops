# NetworkPolicies here express the intended traffic model.
#
# IMPORTANT: NetworkPolicies require a network policy provider in the cluster
# (e.g. Calico or GKE Dataplane V2). They are opt-in and empty policies deny
# all traffic — TEST IN A NON-PROD CLUSTER FIRST before enforcing here.
#
# Roll out sequence:
#   1. Apply only "allow-frontend-to-backend" and "allow-backend-to-db"
#      alongside the default-deny to a staging cluster.
#   2. Verify /health, /ready, and UI still work.
#   3. Then apply to production.
---
# Default-deny for pods in the namespace: nothing goes in or out unless
# explicitly allowed by another policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: smart-education
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Frontend pods: accept HTTP from anywhere in the cluster (the GKE LB reaches
# them through kube-system/ingress-gce). Egress limited to backend + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: smart-education
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-education-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - {}   # any source; the LB and health checks originate outside our labels
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-backend
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Backend pods: accept traffic only from frontend pods (and the LB via the
# ingress-gce component when path-routed to /api). Egress to Postgres + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: smart-education
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-education-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-frontend
      ports:
        - port: 8000
          protocol: TCP
    # GKE Ingress / container-native LB health checks originate from Google
    # Front End ranges, NOT from any pod. Without these ipBlocks the LB will
    # mark backends unhealthy the moment default-deny is enforced.
    # Ref: https://cloud.google.com/load-balancing/docs/health-check-concepts#ip-ranges
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - port: 8000
          protocol: TCP
    # GKE Managed Service for Prometheus collectors live in the
    # `gmp-system` namespace and scrape /metrics on the backend's
    # named http port (8000). Without this rule the default-deny above
    # blocks scrapes and no metrics reach Cloud Monitoring.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # When you switch to Cloud SQL via Private IP, add an egress rule for the
    # VPC CIDR that Cloud SQL uses instead of the pod selector above.
---
# Postgres pods: accept 5432 only from backend + migration Job (both share
# the smart-education-backend name label). Egress limited to DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: smart-education
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-education-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-education-backend
      ports:
        - port: 5432
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
