apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-backend
    app.kubernetes.io/part-of: smart-education-portal
# Non-secret configuration only. Passwords / API keys belong in a Secret
# (see secret.yaml, and prefer Google Secret Manager + External Secrets in
# real production).
data:
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  CORS_ORIGINS: "https://smart-education.example.com"
  DATABASE_HOST: "postgres"       # points at the in-cluster dev Postgres by default; swap for Cloud SQL private IP in production.
  DATABASE_PORT: "5432"
  DATABASE_NAME: "smart_education"
  # Deployment overrides these to 0 so migrations run only from the Job.
  RUN_MIGRATIONS: "0"
  RUN_SEED: "0"
