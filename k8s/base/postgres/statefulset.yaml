# In-cluster Postgres for the free-trial GKE demo. NOT for real production —
# swap for Cloud SQL (Private IP + Workload Identity) when leaving the demo.
#
# Reads credentials from the SAME `backend-secret` and `backend-config` the
# app consumes, so Vault only has to populate one place in the next phase.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: smart-education
  labels:
    app.kubernetes.io/name: smart-education-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: smart-education-portal
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-education-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-education-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: smart-education-portal
    spec:
      nodeSelector:
        workload: application
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # 'postgres' uid in the official postgres image
        runAsGroup: 999
        fsGroup: 999            # lets the PVC be chowned to the postgres group
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_PASSWORD
            # Put PGDATA in a subdir so Postgres doesn't try to initialize on
            # the mount point itself (which some CSI drivers leave with a
            # lost+found dir that trips initdb).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem intentionally NOT set: postgres writes
            # to several rootfs paths at startup. /var/run/postgresql and
            # /tmp are still emptyDir mounts to reduce writable surface.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: smart-education-postgres
          app.kubernetes.io/component: database
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
