# ClusterSecretStore backed by Vault + Kubernetes auth.
#
# - ClusterSecretStore (not SecretStore) so a single instance can be
#   referenced by ExternalSecrets in any namespace, though today we only
#   have one consumer (smart-education/backend-secret).
# - Server points at the in-cluster Vault ClusterIP over plain HTTP.
#   Internal-only; TLS added when Vault leaves the cluster.
# - Path/version match the KV v2 mount at `secret/`.
# - Auth uses Kubernetes auth mount `kubernetes` (default) with role
#   `smart-education-db-reader` and the projected token of
#   external-secrets-sa in the smart-education namespace.
# - Sync wave -10: after Vault + ESO exist but before the ExternalSecret.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: smart-education-portal
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "smart-education-db-reader"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: smart-education
            audiences:
              - vault
