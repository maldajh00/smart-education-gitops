# Network isolation for the Vault namespace.
#
# - default-deny: nothing enters or leaves the vault namespace unless
#   another policy explicitly allows it.
# - allow-vault-ingress-eso: only pods labeled ESO controller in the
#   external-secrets namespace may reach Vault on 8200.
# - allow-vault-egress: Vault needs the Kubernetes API (TokenReview
#   during auth/kubernetes login) and DNS — Vault's own auth config uses
#   the hostname "kubernetes.default.svc", so it dials DNS before it can
#   dial the API. See the two rules' comments below for the specific
#   addresses required (confirmed via live connectivity testing).
#
# Application pods (backend/frontend/postgres) intentionally have NO path
# to Vault — the backend never authenticates to Vault directly.
#
# WHY THIS LIVES IN ITS OWN DIRECTORY/SOURCE INSTEAD OF k8s/vault:
# k8s/vault's kustomization uses the legacy `commonLabels` transformer,
# kept there because the StatefulSet/PodDisruptionBudget spec.selector
# fields are immutable post-creation and already live with the labels
# commonLabels produces — migrating to `labels`/includeSelectors:false
# would change those selectors and be rejected by the API server.
# commonLabels has no per-field opt-out and no way to be shielded by
# nesting (it re-merges its keys into every matchLabels block in the
# FINAL aggregated resource list, after patches run, regardless of which
# nested kustomization a resource came from). The
# allow-vault-ingress-eso "from" selector below describes the ESO
# controller pod in the external-secrets namespace — a Helm-managed pod
# (chart external-secrets) that only ever carries
# app.kubernetes.io/name, never part-of or managed-by=argocd — so if
# built inside k8s/vault, the selector would be padded with labels the
# real pod doesn't have and would never match it. Building these
# NetworkPolicies from a separate kustomize root (see
# ./kustomization.yaml, which uses `labels` + includeSelectors: false)
# keeps every selector exactly as written below while still labeling
# metadata for tracking. This directory is wired into the
# smart-education-vault ArgoCD Application as a second source
# (k8s/argocd/vault-application.yaml).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: vault
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-ingress-eso
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - port: 8200
          protocol: TCP
    # Operators using `kubectl port-forward` originate from the API server
    # side, which is out-of-cluster on GKE and not covered by pod labels;
    # port-forward works through the kubelet and bypasses NetworkPolicy.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-egress
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  egress:
    # DNS: kube-system pods (direct pod-to-pod resolution path)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # DNS: NodeLocal DNSCache. Its Corefile shows
    # `bind 169.254.20.10 34.118.224.10` — it binds directly to both
    # addresses on its own node-local interface, no DNAT involved, so a
    # pod's resolv.conf query to the literal kube-dns ClusterIP
    # (34.118.224.10) needs its own rule same as the node-local address.
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 34.118.224.10/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API (TokenReview during auth/kubernetes login). The
    # "kubernetes" Service (34.118.224.1) has no pod backend; its
    # Endpoints object resolves to the real private control-plane
    # address (currently 10.10.0.2). kube-proxy DNATs to that real
    # address before Calico evaluates the policy, so the rule must
    # target it directly rather than the ClusterIP or a broad
    # except-private-ranges block (which would exclude it, since
    # 10.10.0.2 falls inside 10.0.0.0/8).
    - to:
        - ipBlock:
            cidr: 10.10.0.2/32
      ports:
        - port: 443
          protocol: TCP
    # Cluster peer traffic (harmless with 1 replica; needed if raft added).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8201
          protocol: TCP
